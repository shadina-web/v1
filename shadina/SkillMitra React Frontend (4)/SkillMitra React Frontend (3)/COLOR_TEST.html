<!DOCTYPE html>
<html>
<head>
    <title>COLOR TEST</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial; }
        .box { width: 200px; height: 200px; margin: 10px; display: inline-block; }
        .indigo { background: #6366f1; } /* indigo-500 */
        .purple { background: #a855f7; } /* purple-500 */
        .pink { background: #ec4899; } /* pink-500 */
        .blue { background: #60a5fa; } /* blue-400 */
        .cyan { background: #22d3ee; } /* cyan-400 */
        .rose { background: #fb7185; } /* rose-400 */
        .orange { background: #fb923c; } /* orange-400 */
        .amber { background: #fbbf24; } /* amber-400 */
    </style>
</head>
<body>
    <h1>COLOR TEST - These should be BRIGHT & VISIBLE!</h1>
    <div class="box indigo">INDIGO-500</div>
    <div class="box purple">PURPLE-500</div>
    <div class="box pink">PINK-500</div>
    <div class="box blue">BLUE-400</div>
    <div class="box cyan">CYAN-400</div>
    <div class="box rose">ROSE-400</div>
    <div class="box orange">ORANGE-400</div>
    <div class="box amber">AMBER-400</div>
</body>
</html>
