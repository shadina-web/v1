# Spring datasource (example values — replace with real credentials in production)
# Use H2 file-based database for local build/dev. Data persists between restarts.
spring.datasource.url=jdbc:h2:file:./data/skillmitra;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server port
server.port=8082

# JWT properties
jwt.secret=ChangeThisSecretInProductionToAStrongRandomValue
jwt.expiration-ms=86400000

# CORS (frontend)
frontend.url=http://localhost:3000
